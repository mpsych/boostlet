<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>boostlet dropbox auth</title>
</head>
<body>
<script>
  // extract the auth code from the query string and post it back to the opener
  // the opener is waiting on a postMessage with type dropbox-auth
  const code = new URLSearchParams(location.search).get('code')
  if (code && window.opener) {
    window.opener.postMessage({ type: 'dropbox-auth', code }, '*')
  }
  window.close()
</script>
</body>
</html>
