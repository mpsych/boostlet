<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>sync browser check</title>
  <script src="niivue/js/niivue.umd.js"></script>
</head>
<body style="margin:0;background:#000">
  <canvas id="gl" style="width:100vw;height:100vh;display:block"></canvas>
  <script>
    // a plain niivue page that loads sync on start
    // so a browser without the bookmark can still test it
    window.nv = new niivue.Niivue()
    nv.attachToCanvas(document.getElementById('gl'))
    nv.loadVolumes([{ url: 'niivue/data/avf.nii.gz' }]).then(function () {
      var s = document.createElement('script')
      s.src = '../examples/sync.js?' + Date.now()
      document.head.appendChild(s)
    })
  </script>
</body>
</html>
